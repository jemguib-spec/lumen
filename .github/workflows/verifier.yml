# Compile Lumen et lance les tests à chaque envoi : une version cassée ne part pas en mise à jour.
name: Vérification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compiler-et-tester:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Outils Android et Java
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt apksigner zipalign dalvik-exchange android-sdk-platform-23 openjdk-17-jdk-headless zbar-tools imagemagick
      - name: Compilation
        run: ./build.sh   # clé de test créée à la volée : l'APK produit ici n'est pas publié
      - name: Tests
        run: tests/run.sh
      - name: Le fichier de mise à jour correspond bien à dist/Lumen.apk
        run: |
          if [ -f dist/latest.json ]; then
            want=$(python3 -c "import json;print(json.load(open('dist/latest.json'))['sha256'])")
            got=$(sha256sum dist/Lumen.apk | cut -d' ' -f1)
            test "$want" = "$got" || { echo "dist/latest.json ne correspond pas à dist/Lumen.apk"; exit 1; }
          fi
